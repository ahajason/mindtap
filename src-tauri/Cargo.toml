[package]
name = "mindtap"
version = "0.2.2"
description = "极简记录 APP · 跨平台桌面"
authors = ["AhaJason <Jason-c1@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mindtap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-log = "2.9"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-autostart = "2.5"
# MessageDialogBuilder 回调转 future 需要 oneshot；不引入独立 runtime。
tokio = { version = "1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 0.32 与当前业务 SQL 绑定稳定；不跨到 0.3x/0.4x 以免改 API。
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tauri-plugin-notification = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# 空闲检测仅 Windows；feature 面保持最小。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3"
