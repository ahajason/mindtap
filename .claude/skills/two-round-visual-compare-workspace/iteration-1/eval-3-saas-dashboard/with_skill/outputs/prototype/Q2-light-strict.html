<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q2 — Light / Strict</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 480px; height: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background:
      linear-gradient(180deg, #fafafa 0%, #f1f1f3 100%);
    color: #111114;
    overflow: hidden;
    position: relative;
  }
  .body { position: absolute; inset: 0; padding: 70px 16px 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .kpi { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 6px; padding: 7px 9px; }
  .kpi .l { font-size: 9px; color: #71717a; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
  .kpi .v { font-size: 15px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 9px; color: #16a34a; margin-top: 1px; }
  .table {
    background: #ffffff; border: 1px solid #e4e4e7; border-radius: 6px;
    padding: 4px 0; font-size: 10px;
  }
  .th, .tr { display: grid; grid-template-columns: 1.6fr .7fr .7fr .7fr; gap: 6px; padding: 5px 10px; }
  .th { color: #71717a; text-transform: uppercase; font-size: 8.5px; letter-spacing: 0.05em; border-bottom: 1px solid #e4e4e7; font-weight: 500; }
  .tr { border-bottom: 1px solid #f4f4f5; }
  .tr:last-child { border-bottom: 0; }
  /* Light STRICT glass: even, thin, neutral, sharp 1px hairline */
  .glass {
    position: absolute; left: 12px; right: 12px; top: 12px; height: 44px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px) saturate(1.0);
    -webkit-backdrop-filter: blur(20px) saturate(1.0);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      0 1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: center; padding: 0 10px; gap: 8px;
    font-size: 10.5px; font-weight: 500;
  }
  .glass .crumb { color: #71717a; font-size: 10px; }
  .glass .crumb b { color: #111114; font-weight: 600; }
  .glass .ico { width: 14px; height: 14px; border-radius: 3px; background: #111114; }
  .glass .search {
    margin-left: auto; flex: 1; max-width: 220px; height: 22px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    display: flex; align-items: center; padding: 0 8px;
    color: #71717a; font-size: 9.5px;
  }
  .glass .avatar { width: 20px; height: 20px; border-radius: 4px; background: #2563eb; }
  .seg {
    position: absolute; bottom: 12px; right: 12px;
    display: flex; border-radius: 6px; overflow: hidden;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 6px -3px rgba(0,0,0,0.1);
  }
  .seg span {
    padding: 5px 10px; font-size: 9.5px; font-weight: 600; color: #71717a;
    border-right: 1px solid rgba(0,0,0,0.06);
  }
  .seg span:last-child { border-right: 0; }
  .seg span.on { background: #111114; color: #ffffff; }
  .tag {
    position: absolute; top: 12px; left: 12px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(17, 17, 20, 0.78); color: #fafafa;
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.05em; z-index: 2;
  }
</style>
</head>
<body>
  <div class="tag">Q2 · LIGHT · STRICT</div>
  <div class="glass">
    <span class="ico"></span>
    <span class="crumb">Workspace <b>/ Billing</b></span>
    <span class="search">⌘K  Search…</span>
    <span class="avatar"></span>
  </div>
  <div class="body">
    <div class="row">
      <div class="kpi"><div class="l">MRR</div><div class="v">$184,210</div><div class="d">+6.2%</div></div>
      <div class="kpi"><div class="l">Seats</div><div class="v">2,419</div><div class="d">+38</div></div>
      <div class="kpi"><div class="l">Churn</div><div class="v">2.1%</div><div class="d" style="color:#dc2626">+0.3</div></div>
      <div class="kpi"><div class="l">Trials</div><div class="v">147</div><div class="d">+12</div></div>
    </div>
    <div class="table">
      <div class="th"><div>Customer</div><div>Plan</div><div>MRR</div><div>Status</div></div>
      <div class="tr"><div>Northwind Labs</div><div>Team</div><div>$2,400</div><div>Active</div></div>
      <div class="tr"><div>Helio &amp; Sons</div><div>Pro</div><div>$980</div><div>Active</div></div>
      <div class="tr"><div>Atlas Brewing Co</div><div>Team</div><div>$1,440</div><div>Past due</div></div>
      <div class="tr"><div>Roam Mobility</div><div>Starter</div><div>$220</div><div>Active</div></div>
    </div>
  </div>
  <div class="seg">
    <span class="on">7d</span><span>30d</span><span>90d</span>
  </div>
</body>
</html>
