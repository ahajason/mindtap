<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D6 — Productive (high info density)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 480px; height: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: #f6f6f7;
    color: #1d1d1f;
    overflow: hidden;
    position: relative;
  }
  /* High-density productive tile: command palette, task flow, keybinding hints */
  .body { position: absolute; inset: 0; padding: 8px 10px; }
  .cmd {
    background: #ffffff; border: 1px solid #d2d2d7; border-radius: 8px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.12);
    padding: 8px 10px; margin-bottom: 8px;
  }
  .cmd .input {
    font-size: 11px; color: #1d1d1f; padding: 4px 0; border-bottom: 1px solid #e5e5ea; padding-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .cmd .input::before { content: "⌘K"; font-size: 9px; color: #6e6e73; background: #f2f2f7; padding: 2px 5px; border-radius: 4px; border: 1px solid #e5e5ea; }
  .cmd .input span { color: #1d1d1f; }
  .cmd .item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 10px; }
  .cmd .item .k { color: #6e6e73; }
  .cmd .item .v { color: #1d1d1f; font-weight: 500; }
  .cmd .item .shortcut { font-family: "SF Mono", ui-monospace, monospace; font-size: 9px; color: #6e6e73; background: #f2f2f7; padding: 1px 4px; border-radius: 3px; }
  /* Task flow / command palette row */
  .flow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .step {
    background: #ffffff; border: 1px solid #d2d2d7; border-radius: 6px; padding: 6px 8px; position: relative;
  }
  .step .n { font-size: 9px; color: #6e6e73; font-weight: 600; }
  .step .t { font-size: 10px; color: #1d1d1f; font-weight: 600; margin-top: 1px; }
  .step .m { font-size: 9px; color: #6e6e73; margin-top: 2px; }
  .step.active { border-color: #1d1d1f; box-shadow: 0 0 0 1px #1d1d1f; }
  /* Status footer (real signals) */
  .status {
    background: #ffffff; border: 1px solid #d2d2d7; border-radius: 6px; padding: 6px 10px;
    display: flex; justify-content: space-between; font-size: 9.5px; color: #6e6e73;
  }
  .status b { color: #1d1d1f; font-variant-numeric: tabular-nums; }
  /* Productive glass: thin, sharp, monospace hint, neutral */
  .glass {
    position: absolute; left: 8px; right: 8px; top: 8px; height: 36px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      0 1px 0 rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: center; padding: 0 10px; gap: 6px;
    font-size: 10px; font-weight: 500;
  }
  .glass .crumb { color: #6e6e73; font-size: 9.5px; }
  .glass .crumb b { color: #1d1d1f; font-weight: 600; }
  .glass .ico { width: 12px; height: 12px; border-radius: 2px; background: #1d1d1f; }
  .glass .hint {
    margin-left: auto; font-family: "SF Mono", ui-monospace, monospace;
    font-size: 9px; color: #6e6e73;
    background: rgba(0,0,0,0.04); padding: 2px 5px; border-radius: 3px;
  }
  .tag {
    position: absolute; top: 8px; right: 8px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(29, 29, 31, 0.78); color: #fafafa;
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.05em; z-index: 2;
  }
</style>
</head>
<body>
  <div class="tag">D6 · PRODUCTIVE</div>
  <div class="glass">
    <span class="ico"></span>
    <span class="crumb">Invoices <b>/ INV-2026-0418</b></span>
    <span class="hint">⌘⇧E export</span>
  </div>
  <div class="body" style="padding-top: 50px;">
    <div class="cmd">
      <div class="input"><span>Refund INV-2026-0418</span></div>
      <div class="item"><span class="k">Customer</span><span class="v">Northwind Labs</span></div>
      <div class="item"><span class="k">Amount</span><span class="v">$2,400.00</span><span class="shortcut">⇧⏎</span></div>
      <div class="item"><span class="k">Reason</span><span class="v">Duplicate charge</span></div>
    </div>
    <div class="flow">
      <div class="step"><div class="n">STEP 1</div><div class="t">Verify</div><div class="m">Stripe ✓</div></div>
      <div class="step active"><div class="n">STEP 2</div><div class="t">Approve</div><div class="m">Manager</div></div>
      <div class="step"><div class="n">STEP 3</div><div class="t">Refund</div><div class="m">3-5d</div></div>
    </div>
    <div class="status">
      <span>Queue <b>14</b></span>
      <span>Processed <b>$48,210</b></span>
      <span>Failed <b style="color:#c2410c">2</b></span>
      <span>SLA <b>2.3h</b></span>
    </div>
  </div>
</body>
</html>
