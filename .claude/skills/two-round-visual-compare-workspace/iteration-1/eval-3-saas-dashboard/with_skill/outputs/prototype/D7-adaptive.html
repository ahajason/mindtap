<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D7 — Adaptive (responsive density)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 480px; height: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background:
      linear-gradient(180deg, #fef7e6 0%, #f5e6c8 100%);
    color: #2a1f0f;
    overflow: hidden;
    position: relative;
  }
  /* Adaptive: three breakpoints in one frame — desktop / tablet / phone */
  .strip {
    position: absolute; left: 0; right: 0; top: 56px; bottom: 0;
    display: grid; grid-template-columns: 1.4fr 1fr 0.5fr; gap: 8px;
    padding: 8px 10px;
  }
  .frame {
    background: #ffffff; border: 1px solid #e6d6b3; border-radius: 8px; padding: 6px 7px;
    display: flex; flex-direction: column;
  }
  .frame .title { font-size: 8.5px; color: #8a6f3a; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .frame .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .frame .d { font-size: 8.5px; color: #2c7a3d; font-weight: 600; }
  .frame .row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed #f0e5cb; font-size: 8.5px; }
  .frame .row:last-child { border-bottom: 0; }
  .frame .row .k { color: #6a5320; }
  .frame .row .v { color: #2a1f0f; font-weight: 600; font-size: 9px; }
  .frame.tablet .v { font-size: 12px; }
  .frame.phone { align-items: center; text-align: center; }
  .frame.phone .v { font-size: 10px; }
  /* Adaptive glass: a single bar above, with breakpoint-aware insets */
  .glass {
    position: absolute; left: 8px; right: 8px; top: 8px; height: 40px;
    border-radius: 12px;
    background: rgba(255, 250, 240, 0.55);
    backdrop-filter: blur(22px) saturate(1.15);
    -webkit-backdrop-filter: blur(22px) saturate(1.15);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 0 -1px 0 rgba(120, 90, 30, 0.10),
      0 6px 16px -8px rgba(120, 90, 30, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.6);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    font-size: 10.5px; font-weight: 600;
  }
  .glass .crumb { color: #8a6f3a; font-size: 10px; }
  .glass .crumb b { color: #2a1f0f; }
  .glass .ico { width: 14px; height: 14px; border-radius: 4px; background: #c97b3a; }
  .glass .seg {
    margin-left: auto; display: flex; gap: 2px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 6px; padding: 1px;
  }
  .glass .seg span { padding: 2px 6px; font-size: 8.5px; color: #8a6f3a; border-radius: 4px; font-weight: 600; }
  .glass .seg span.on { background: #2a1f0f; color: #fef7e6; }
  .tag {
    position: absolute; top: 8px; left: 8px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(42, 31, 15, 0.78); color: #fef7e6;
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.05em; z-index: 2;
  }
</style>
</head>
<body>
  <div class="tag">D7 · ADAPTIVE</div>
  <div class="glass">
    <span class="ico"></span>
    <span class="crumb">MRR Overview</span>
    <div class="seg"><span class="on">Desktop</span><span>Tablet</span><span>Phone</span></div>
  </div>
  <div class="strip">
    <div class="frame">
      <div class="title">Desktop · 4 KPIs</div>
      <div class="v">$184,210</div>
      <div class="d">+6.2% MoM</div>
      <div class="row"><span class="k">Seats</span><span class="v">2,419</span></div>
      <div class="row"><span class="k">Churn</span><span class="v">2.1%</span></div>
      <div class="row"><span class="k">Trials</span><span class="v">147</span></div>
    </div>
    <div class="frame tablet">
      <div class="title">Tablet · 2 KPIs</div>
      <div class="v">$184,210</div>
      <div class="d">+6.2%</div>
      <div class="row"><span class="k">Seats</span><span class="v">2,419</span></div>
      <div class="row"><span class="k">Churn</span><span class="v">2.1%</span></div>
    </div>
    <div class="frame phone">
      <div class="title">Phone · 1 KPI</div>
      <div class="v">$184k</div>
      <div class="d">+6.2%</div>
    </div>
  </div>
</body>
</html>
