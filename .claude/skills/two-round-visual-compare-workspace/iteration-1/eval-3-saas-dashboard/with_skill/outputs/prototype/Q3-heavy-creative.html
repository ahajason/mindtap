<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q3 — Heavy / Creative</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 480px; height: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background:
      radial-gradient(80% 60% at 80% 10%, #d6e3ee 0%, #c3cfdd 45%, #a8b3c1 100%);
    color: #15202b;
    overflow: hidden;
    position: relative;
  }
  /* Real content: SaaS dashboard with hero metric and chart card */
  .body { position: absolute; inset: 0; padding: 80px 18px 18px; }
  .hero {
    background: #ffffff; border-radius: 14px; padding: 12px 14px;
    border: 1px solid #d6dde6;
    box-shadow: 0 4px 18px -10px rgba(20, 40, 70, 0.18);
    margin-bottom: 10px;
  }
  .hero .l { font-size: 10px; color: #5a6877; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
  .hero .v { font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .hero .d { font-size: 10px; color: #2c7a3d; margin-top: 2px; font-weight: 600; }
  .chart {
    background: #ffffff; border-radius: 14px; padding: 12px 14px;
    border: 1px solid #d6dde6; height: 122px;
    position: relative;
  }
  .chart .l { font-size: 10px; color: #5a6877; font-weight: 600; }
  .chart .y { font-size: 9px; color: #95a2af; position: absolute; right: 10px; top: 10px; }
  svg { width: 100%; height: 80px; margin-top: 6px; display: block; }
  /* Heavy CREATIVE glass: thick blur, larger radius, saturated dimming layer */
  .glass {
    position: absolute; left: 10px; right: 10px; top: 10px; height: 56px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.32);
    backdrop-filter: blur(28px) saturate(1.3);
    -webkit-backdrop-filter: blur(28px) saturate(1.3);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(40, 60, 90, 0.10),
      0 10px 30px -10px rgba(20, 40, 70, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.45);
    display: flex; align-items: center; padding: 0 14px; gap: 10px;
    font-size: 11px; font-weight: 600;
  }
  .glass .logo { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg, #4a8fcf, #2a5fa8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
  .glass .crumb { color: #3a4a5a; font-weight: 500; font-size: 10.5px; }
  .glass .crumb b { color: #15202b; }
  .glass .search {
    margin-left: auto; flex: 1; max-width: 220px; height: 26px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; padding: 0 10px;
    color: #5a6877; font-weight: 500; font-size: 10px;
  }
  .glass .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #f4a87a, #c95a2a); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
  .fab {
    position: absolute; bottom: 16px; right: 16px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(22px) saturate(1.25);
    -webkit-backdrop-filter: blur(22px) saturate(1.25);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.7),
      0 8px 18px -8px rgba(20, 40, 70, 0.4);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #15202b;
  }
  .tag {
    position: absolute; top: 10px; left: 10px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(21, 32, 43, 0.78); color: #d6e3ee;
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.05em; z-index: 2;
  }
</style>
</head>
<body>
  <div class="tag">Q3 · HEAVY · CREATIVE</div>
  <div class="glass">
    <span class="logo"></span>
    <span class="crumb">Workspace <b>/ Overview</b></span>
    <span class="search">⌘K  Search anything…</span>
    <span class="avatar"></span>
  </div>
  <div class="body">
    <div class="hero">
      <div class="l">Monthly recurring revenue</div>
      <div class="v">$184,210 <span style="font-size:14px;color:#5a6877;font-weight:500">USD</span></div>
      <div class="d">▲ $10,820 vs last month · +6.2%</div>
    </div>
    <div class="chart">
      <div class="l">Net new MRR · last 30 days</div>
      <div class="y">USD</div>
      <svg viewBox="0 0 300 80" preserveAspectRatio="none">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4a8fcf" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#4a8fcf" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M0,60 L20,55 L40,58 L60,50 L80,52 L100,45 L120,48 L140,40 L160,42 L180,35 L200,30 L220,33 L240,25 L260,28 L280,20 L300,18 L300,80 L0,80 Z" fill="url(#g1)"/>
        <path d="M0,60 L20,55 L40,58 L60,50 L80,52 L100,45 L120,48 L140,40 L160,42 L180,35 L200,30 L220,33 L240,25 L260,28 L280,20 L300,18" fill="none" stroke="#2a5fa8" stroke-width="1.5"/>
      </svg>
    </div>
  </div>
  <div class="fab">+</div>
</body>
</html>
