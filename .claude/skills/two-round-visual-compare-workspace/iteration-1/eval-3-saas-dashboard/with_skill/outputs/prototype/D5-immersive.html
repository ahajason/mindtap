<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D5 — Single-hue Immersive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 480px; height: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, #1d3557 0%, #0f1f33 60%, #0a1626 100%);
    color: #f0f4f8;
    overflow: hidden;
    position: relative;
  }
  /* Single-hue (deep blue) with real content peeking through */
  .headline {
    position: absolute; top: 28px; left: 18px; right: 18px;
  }
  .headline .eyebrow { font-size: 9px; color: #6f93c2; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .headline .h { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
  .headline .h .accent { color: #7cb1ff; }
  .headline .sub { font-size: 10.5px; color: #b8cce0; margin-top: 4px; line-height: 1.4; }
  /* Real content: data table on the bottom 2/3, glass toolbar floating */
  .panel {
    position: absolute; left: 12px; right: 12px; bottom: 56px; top: 110px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .panel .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 10px; }
  .panel .row:last-child { border-bottom: 0; }
  .panel .name { display: flex; gap: 6px; align-items: center; }
  .panel .dot { width: 6px; height: 6px; border-radius: 50%; }
  .panel .row .lbl { color: #b8cce0; }
  .panel .row .val { color: #f0f4f8; font-variant-numeric: tabular-nums; font-weight: 600; }
  /* Single-hue immersive glass: low-saturation, deep-tint heavy blur */
  .glass {
    position: absolute; left: 12px; right: 12px; bottom: 8px; height: 40px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(30px) saturate(1.0);
    -webkit-backdrop-filter: blur(30px) saturate(1.0);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.1),
      0 8px 20px -8px rgba(0,0,0,0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex; align-items: center; padding: 0 10px; gap: 4px;
  }
  .glass span { padding: 4px 9px; border-radius: 6px; font-size: 9.5px; font-weight: 600; color: #b8cce0; }
  .glass span.on { background: rgba(124, 177, 255, 0.18); color: #d6e7ff; }
  .glass .right { margin-left: auto; padding: 4px 10px; border-radius: 6px; background: #7cb1ff; color: #0a1626; font-weight: 700; }
  .tag {
    position: absolute; top: 8px; left: 8px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(124, 177, 255, 0.25); color: #d6e7ff;
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; z-index: 2;
  }
</style>
</head>
<body>
  <div class="tag">D5 · IMMERSIVE</div>
  <div class="headline">
    <div class="eyebrow">Q2 REPORT</div>
    <div class="h">$184,210 MRR · <span class="accent">+6.2%</span></div>
    <div class="sub">2,419 paying seats across 412 customers · weekly active 78%</div>
  </div>
  <div class="panel">
    <div class="row"><div class="name"><div class="dot" style="background:#7cb1ff"></div><div class="lbl">Northwind Labs</div></div><div class="val">$2,400</div></div>
    <div class="row"><div class="name"><div class="dot" style="background:#9a8cff"></div><div class="lbl">Helio &amp; Sons</div></div><div class="val">$980</div></div>
    <div class="row"><div class="name"><div class="dot" style="background:#5fd2a4"></div><div class="lbl">Atlas Brewing Co</div></div><div class="val">$1,440</div></div>
    <div class="row"><div class="name"><div class="dot" style="background:#f4a87a"></div><div class="lbl">Roam Mobility</div></div><div class="val">$220</div></div>
    <div class="row"><div class="name"><div class="dot" style="background:#e879a8"></div><div class="lbl">Cardinal Freight</div></div><div class="val">$3,120</div></div>
  </div>
  <div class="glass">
    <span class="on">All</span><span>Active</span><span>Past due</span><span>Trialing</span>
    <span class="right">Export</span>
  </div>
</body>
</html>
