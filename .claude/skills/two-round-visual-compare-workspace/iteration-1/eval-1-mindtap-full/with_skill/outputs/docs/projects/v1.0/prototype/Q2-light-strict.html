<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480,initial-scale=1">
<title>Q2 · Light · Strict</title>
<style>
  /* ===== Q2: Light + Strict =====
     玻璃：薄但严肃；字间距严格、栅格对齐、不装饰。
     适合：工程、文档、严肃记录。
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 360px; overflow: hidden; font-family: "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif; }
  body {
    background: #f4f4f4;
    color: #1d1d1f;
  }
  /* 内容层：纯白卡片 + 严格边框 */
  .doc {
    position: absolute;
    inset: 56px 24px 56px 24px;
    background: #ffffff;
    border: 1px solid #d2d2d7;
    border-radius: 6px;
    padding: 14px 16px;
    box-shadow: 0 1px 0 #ffffff inset, 0 8px 16px -10px rgba(0,0,0,.08);
  }
  .doc h3 {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; font-weight: 600;
    color: #6e6e73;
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 8px;
  }
  .doc .row {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px; line-height: 1.7;
    color: #1d1d1f;
    border-bottom: 1px solid #f0f0f0;
    padding: 3px 0;
    display: flex; justify-content: space-between;
  }
  .doc .row .k { color: #6e6e73; }
  .doc .row .v { color: #1d1d1f; font-weight: 500; }
  /* 玻璃顶栏（轻、严格） */
  .topbar-glass {
    position: absolute;
    top: 14px; left: 24px; right: 24px; height: 30px;
    background: rgba(244, 244, 244, 0.55);
    backdrop-filter: saturate(140%) blur(18px);
    -webkit-backdrop-filter: saturate(140%) blur(18px);
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,.06);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      inset 0 -1px 0 rgba(0,0,0,.04);
    display: flex; align-items: center; padding: 0 12px; gap: 12px;
  }
  .topbar-glass .label {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 10.5px; font-weight: 600; color: #1d1d1f; letter-spacing: .08em;
    text-transform: uppercase;
  }
  .topbar-glass .spacer { flex: 1; }
  .topbar-glass .btn-g {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 10px; padding: 3px 8px; color: #1d1d1f;
    background: rgba(255,255,255,.4);
    border-radius: 4px; border: 1px solid rgba(0,0,0,.06);
  }
  /* 浮动按钮（紧凑、正方形感） */
  .fab-glass {
    position: absolute; right: 24px; bottom: 16px;
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: saturate(140%) blur(18px);
    -webkit-backdrop-filter: saturate(140%) blur(18px);
    border: 1px solid rgba(0,0,0,.1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      0 4px 12px -4px rgba(0,0,0,.18);
    display: grid; place-items: center;
    font-family: "SF Mono", monospace;
    font-size: 16px; font-weight: 500; color: #1d1d1f;
  }
  .label-q {
    position: absolute; bottom: 16px; left: 24px;
    font-family: "SF Mono", monospace;
    font-size: 10px; letter-spacing: .12em; color: #6e6e73;
  }
</style>
</head>
<body>
  <!-- 控制层：玻璃顶栏 -->
  <div class="topbar-glass">
    <div class="label">MINDTAP</div>
    <div class="spacer"></div>
    <div class="btn-g">⌘ K</div>
    <div class="btn-g">+ NEW</div>
  </div>

  <!-- 内容层：文档式数据 -->
  <div class="doc">
    <h3>RECORD · 0014</h3>
    <div class="row"><span class="k">created</span><span class="v">2026-06-14 14:09</span></div>
    <div class="row"><span class="k">type</span><span class="v">inspiration</span></div>
    <div class="row"><span class="k">tags</span><span class="v">design, glass</span></div>
    <div class="row"><span class="k">words</span><span class="v">42</span></div>
    <div class="row"><span class="k">status</span><span class="v">draft</span></div>
    <div class="row"><span class="k">id</span><span class="v">mnt-0014</span></div>
  </div>

  <!-- 控制层：浮动玻璃按钮 -->
  <div class="fab-glass">+</div>

  <div class="label-q">Q2 · LIGHT · STRICT</div>
</body>
</html>
