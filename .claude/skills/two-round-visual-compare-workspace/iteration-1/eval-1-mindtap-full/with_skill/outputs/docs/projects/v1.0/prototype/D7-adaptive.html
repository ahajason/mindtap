<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480,initial-scale=1">
<title>D7 · Adaptive (responsive)</title>
<style>
  /* ===== D7: Adaptive =====
     自适应：同一玻璃在亮/暗模式下的两种呈现。
     适合：跨平台、尊重系统设置的 app。
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 360px; overflow: hidden; font-family: -apple-system, "SF Pro Text", sans-serif; }
  body {
    background: #ffffff;
    color: #1d1d1f;
  }
  /* 左侧：亮模式 */
  .half {
    position: absolute; top: 0; bottom: 0;
    width: 50%;
    overflow: hidden;
  }
  .half.light { left: 0; background: #f5f5f7; }
  .half.dark { right: 0; background: #1c1c1e; color: #fff; }
  .half .vline {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(0,0,0,.12);
  }
  .half.dark .vline { background: rgba(255,255,255,.1); }
  /* 内容层：同一内容，亮 vs 暗 */
  .content {
    position: absolute;
    top: 60px; left: 12px; right: 12px; bottom: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .half.light .content {
    --bg: #fff; --border: #e2e2e5;
  }
  .half.dark .content {
    --bg: #2c2c2e; --border: rgba(255,255,255,.08);
  }
  .content h4 {
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    color: var(--title);
    margin-bottom: 8px;
  }
  .half.light .content h4 { --title: #1d1d1f; }
  .half.dark .content h4 { --title: #fff; }
  .content p {
    font-size: 10.5px; line-height: 1.55;
    color: var(--ink);
  }
  .half.light .content p { --ink: #424245; }
  .half.dark .content p { --ink: #aeaeb2; }
  /* 玻璃顶栏 —— 亮 vs 暗 */
  .topbar-glass {
    position: absolute;
    top: 14px; left: 12px; right: 12px; height: 32px;
    backdrop-filter: saturate(160%) blur(18px);
    -webkit-backdrop-filter: saturate(160%) blur(18px);
    border-radius: 8px;
    display: flex; align-items: center; padding: 0 10px; gap: 6px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      0 1px 2px rgba(0,0,0,.06);
  }
  .half.light .topbar-glass {
    background: rgba(245, 245, 247, 0.6);
    border: 1px solid rgba(0,0,0,.06);
  }
  .half.dark .topbar-glass {
    background: rgba(28, 28, 30, 0.6);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      0 1px 2px rgba(0,0,0,.4);
  }
  .topbar-glass .label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  }
  .half.light .label { color: #1d1d1f; }
  .half.dark .label { color: #fff; }
  .topbar-glass .spacer { flex: 1; }
  .topbar-glass .ico {
    width: 20px; height: 20px; border-radius: 4px;
    display: grid; place-items: center;
    font-size: 10px;
  }
  .half.light .ico { background: rgba(0,0,0,.06); color: #1d1d1f; }
  .half.dark .ico { background: rgba(255,255,255,.1); color: #fff; }
  /* 浮动按钮 —— 亮 vs 暗 */
  .fab-glass {
    position: absolute; bottom: 14px; right: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    backdrop-filter: saturate(160%) blur(18px);
    -webkit-backdrop-filter: saturate(160%) blur(18px);
    display: grid; place-items: center;
    font-size: 14px; font-weight: 500;
  }
  .half.light .fab-glass {
    background: rgba(255,255,255,.75);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 10px -2px rgba(0,0,0,.15);
    color: #1d1d1f;
  }
  .half.dark .fab-glass {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 4px 10px -2px rgba(0,0,0,.5);
    color: #fff;
  }
  .label-q {
    position: absolute; bottom: 8px; left: 12px;
    font-size: 9px; letter-spacing: .14em;
  }
  .half.light .label-q { color: #8e8e93; }
  .half.dark .label-q { color: #636366; }
  .half-label {
    position: absolute; top: 8px; left: 12px;
    font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase;
  }
  .half.light .half-label { color: #8e8e93; }
  .half.dark .half-label { color: #636366; }
</style>
</head>
<body>
  <!-- 左侧：亮模式 -->
  <div class="half light">
    <div class="half-label">LIGHT</div>
    <div class="vline"></div>
    <div class="topbar-glass">
      <div class="label">Mindtap</div>
      <div class="spacer"></div>
      <div class="ico">⌕</div>
      <div class="ico">+</div>
    </div>
    <div class="content">
      <h4>记录 #0014</h4>
      <p>同一玻璃，在亮模式下是暖白半透；在暗模式下自动取色，文字变白。</p>
    </div>
    <div class="fab-glass">+</div>
    <div class="label-q">D7 · ADAPTIVE</div>
  </div>

  <!-- 右侧：暗模式 -->
  <div class="half dark">
    <div class="half-label">DARK</div>
    <div class="vline"></div>
    <div class="topbar-glass">
      <div class="label">Mindtap</div>
      <div class="spacer"></div>
      <div class="ico">⌕</div>
      <div class="ico">+</div>
    </div>
    <div class="content">
      <h4>记录 #0014</h4>
      <p>同一玻璃，在亮模式下是暖白半透；在暗模式下自动取色，文字变白。</p>
    </div>
    <div class="fab-glass">+</div>
    <div class="label-q">D7 · ADAPTIVE</div>
  </div>
</body>
</html>
