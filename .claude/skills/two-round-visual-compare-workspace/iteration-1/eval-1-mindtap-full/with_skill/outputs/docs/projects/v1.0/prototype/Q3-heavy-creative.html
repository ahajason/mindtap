<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480,initial-scale=1">
<title>Q3 · Heavy · Creative</title>
<style>
  /* ===== Q3: Heavy + Creative =====
     玻璃：厚、模糊重、有染色；可容纳彩色背景。
     适合：沉浸、媒体丰富、表达型 app。
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 360px; overflow: hidden; font-family: -apple-system, "SF Pro Display", sans-serif; }
  body {
    /* 丰富视觉内容（不玻璃） */
    background:
      radial-gradient(60% 40% at 20% 20%, #ff9966 0%, transparent 60%),
      radial-gradient(60% 40% at 80% 30%, #ff5e62 0%, transparent 60%),
      radial-gradient(80% 50% at 50% 90%, #5b3a8a 0%, transparent 60%),
      #1a1024;
    color: #fff;
  }
  /* 内容层：沉浸式媒体（不玻璃） */
  .media {
    position: absolute;
    inset: 64px 24px 64px 24px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
  }
  .media .img-layer {
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.05), rgba(0,0,0,.4)),
      repeating-linear-gradient(90deg, #ffb347 0 30px, #ff7e5f 30px 60px, #6a4c93 60px 90px);
    filter: saturate(140%);
  }
  .media .caption {
    position: absolute; left: 14px; bottom: 12px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .media .meta {
    position: absolute; left: 14px; top: 12px;
    font-size: 10px; letter-spacing: .12em; color: rgba(255,255,255,.85);
    text-transform: uppercase;
  }
  /* 厚玻璃顶栏（染色） */
  .topbar-glass {
    position: absolute;
    top: 14px; left: 24px; right: 24px; height: 38px;
    background: rgba(20, 12, 30, 0.42);
    backdrop-filter: saturate(180%) blur(28px);
    -webkit-backdrop-filter: saturate(180%) blur(28px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.16);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(0,0,0,.18),
      0 8px 20px -8px rgba(0,0,0,.4);
    display: flex; align-items: center; padding: 0 14px; gap: 10px;
  }
  .topbar-glass .label { font-size: 12px; font-weight: 600; color: #fff; letter-spacing: .02em; }
  .topbar-glass .spacer { flex: 1; }
  .topbar-glass .ico {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.14);
    display: grid; place-items: center;
    font-size: 12px; color: #fff;
  }
  /* 厚玻璃浮动按钮（染色、强调） */
  .fab-glass {
    position: absolute; right: 24px; bottom: 14px;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid rgba(255,255,255,.3);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -1px 0 rgba(0,0,0,.15),
      0 10px 24px -6px rgba(0,0,0,.5);
    display: grid; place-items: center;
    font-size: 22px; font-weight: 300; color: #fff;
  }
  .label-q {
    position: absolute; bottom: 18px; left: 24px;
    font-size: 10px; letter-spacing: .18em; color: rgba(255,255,255,.7); text-transform: uppercase;
  }
</style>
</head>
<body>
  <!-- 控制层：厚玻璃顶栏（染了色） -->
  <div class="topbar-glass">
    <div class="label">晚念 · Mindtap</div>
    <div class="spacer"></div>
    <div class="ico">⌕</div>
    <div class="ico">♡</div>
  </div>

  <!-- 内容层：沉浸式媒体 -->
  <div class="media">
    <div class="img-layer"></div>
    <div class="meta">SUNSET · 19:42</div>
    <div class="caption">今天看到的光</div>
  </div>

  <!-- 控制层：厚玻璃浮动按钮 -->
  <div class="fab-glass">+</div>

  <div class="label-q">Q3 · HEAVY · CREATIVE</div>
</body>
</html>
