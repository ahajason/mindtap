<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480,initial-scale=1">
<title>Q1 · Light · Creative</title>
<style>
  /* ===== Q1: Light + Creative =====
     玻璃：薄、轻、通透；调性偏柔和、可变。
     适合：灵感、随笔、轻量记录。
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 360px; overflow: hidden; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body {
    /* 暖白基色 + 真实纸张感 */
    background:
      radial-gradient(120% 80% at 30% 20%, #f6efe3 0%, transparent 60%),
      radial-gradient(140% 100% at 80% 90%, #ecdfc9 0%, transparent 60%),
      #f4ecdc;
    color: #2a2620;
  }
  /* 内容层（不玻璃）——模拟笔记纸张 */
  .paper {
    position: absolute;
    inset: 20px 24px 76px 24px;
    background: #fdf9f0;
    border: 1px solid rgba(60,40,20,.08);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 12px 28px -16px rgba(80,50,20,.18);
  }
  .paper h3 { font-size: 13px; font-weight: 600; color: #5a4a35; margin-bottom: 8px; letter-spacing: .02em; }
  .paper p { font-size: 11.5px; line-height: 1.55; color: #3a3328; }
  .paper .quote {
    margin-top: 10px;
    padding: 8px 10px;
    border-left: 2px solid #c9a978;
    font-style: italic;
    color: #5a4a35;
    font-size: 11px;
  }
  /* 标签 chips（content 上，非玻璃） */
  .chip {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: #efe3cd; color: #6b5234; margin-right: 4px;
  }
  /* 玻璃顶栏（控制层）——薄、轻 */
  .topbar-glass {
    position: absolute;
    top: 12px; left: 24px; right: 24px; height: 36px;
    background: rgba(255, 252, 244, 0.42);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-radius: 12px;
    /* 镜面高光：top highlight + bottom shadow + 1px inset */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -1px 0 rgba(140,100,60,.05),
      0 1px 2px rgba(120,90,50,.08);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    border: 1px solid rgba(255,255,255,.5);
  }
  .topbar-glass .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9a978; }
  .topbar-glass .label { font-size: 11px; font-weight: 600; color: #5a4a35; letter-spacing: .02em; }
  .topbar-glass .spacer { flex: 1; }
  .topbar-glass .ico { font-size: 11px; color: #6b5234; opacity: .7; padding: 4px 6px; border-radius: 6px; }
  /* 浮动玻璃按钮（右下） */
  .fab-glass {
    position: absolute; right: 24px; bottom: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 252, 244, 0.5);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -1px 0 rgba(140,100,60,.06),
      0 8px 18px -6px rgba(120,80,30,.25);
    display: grid; place-items: center;
    font-size: 20px; font-weight: 300; color: #6b5234;
  }
  .label-q {
    position: absolute; bottom: 8px; left: 24px;
    font-size: 10px; letter-spacing: .15em; color: #8a7250; text-transform: uppercase;
  }
</style>
</head>
<body>
  <!-- 内容层：真实记录（不玻璃） -->
  <div class="paper">
    <h3>记录 #0014 · 灵感</h3>
    <p>
      玻璃层只承载控件，不承载内容。纸张质感的卡片在后，
      <span class="chip">灵感</span>
      标签贴在内容上而非漂浮在玻璃层。
    </p>
    <div class="quote">
      "写下来是为了不遗忘——记录本身是目的。"
    </div>
  </div>

  <!-- 控制层：玻璃顶栏 -->
  <div class="topbar-glass">
    <div class="dot"></div>
    <div class="label">Mindtap</div>
    <div class="spacer"></div>
    <div class="ico">⌘K</div>
    <div class="ico">+</div>
  </div>

  <!-- 控制层：浮动玻璃按钮 -->
  <div class="fab-glass">+</div>

  <div class="label-q">Q1 · LIGHT · CREATIVE</div>
</body>
</html>
