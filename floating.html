<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindtap 计时</title>
    <script>
      // Dev/Tauri-runtime polyfill: 仅在 __TAURI_INTERNALS__ 未注入时 (vite dev / 普通浏览器)
      // 提供 stub, 让 React 组件不 throw, dev 实测可 mount
      if (!window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: "floating" },
            currentWebview: { label: "floating", windowLabel: "floating" },
          },
          invoke: async (cmd) => {
            if (cmd === "plugin:window|getCurrentWindow") return { label: "floating" };
            if (cmd === "plugin:webview|getCurrentWebviewWindow") return { label: "floating" };
            if (cmd === "plugin:window|set_focus") return null;
            if (cmd === "plugin:window|set_focusable") return null;
            if (cmd === "plugin:window|set_size") return null;
            if (cmd === "plugin:window|set_position") return null;
            if (cmd === "plugin:window|outer_position") return { x: 100, y: 60 };
            if (cmd === "plugin:window|outer_size") return { width: 360, height: 36 };
            if (cmd === "plugin:window|start_dragging") return null;
            if (cmd === "plugin:window|available_monitors") return [{
              position: { x: 0, y: 0 }, size: { width: 1920, height: 1080 }, scaleFactor: 1, name: "primary"
            }];
            if (cmd === "plugin:event|listen") return 1;
            if (cmd === "plugin:event|unlisten") return null;
            if (cmd.startsWith("plugin:event|")) return null;
            if (cmd === "item_list") return [];
            if (cmd === "item_create") return { id: 1, content: "test", type: "task", status: "todo", focus_ms: 0, last_active_at: null, progress_note: null, source: "manual", pending_ms: null, created_at: Date.now(), updated_at: Date.now() };
            if (cmd === "item_start") return { item: { id: 1, content: "test", type: "task", status: "active", focus_ms: 0, last_active_at: Date.now(), progress_note: null, source: "manual", pending_ms: null, created_at: Date.now(), updated_at: Date.now() }, switched_from: [] };
            if (cmd === "item_pause") return { item: { id: 1, content: "test", type: "task", status: "todo", focus_ms: 0, last_active_at: null, progress_note: null, source: "manual", pending_ms: null, created_at: Date.now(), updated_at: Date.now() }, pending_ms: null };
            if (cmd === "item_complete") return { id: 1, content: "test", type: "task", status: "archived", focus_ms: 0, last_active_at: null, progress_note: null, source: "manual", pending_ms: null, created_at: Date.now(), updated_at: Date.now() };
            if (cmd === "app_exit") return null;
            return null;
          },
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/floating/main.tsx"></script>
  </body>
</html>
